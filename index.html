<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | SIMECAR S.A.C.</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://galywfaztkjiybvopurq.supabase.co; img-src 'self' data:;">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo" aria-hidden="true">
                    <img src="fondo.png" alt="SIMECAR S.A.C.">
                </div>
                <h1>SIMECAR S.A.C.</h1>
                <p>Ingresa tus credenciales para continuar</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="username">
                        <i class="fas fa-envelope"></i>
                        Correo electrónico
                    </label>
                    <input type="email" id="username" name="username" placeholder="correo@empresa.com" autocomplete="email" required>
                    <div class="input-highlight"></div>
                </div>
                
                <div class="input-group">
                    <label for="password">
                        <i class="fas fa-key"></i>
                        Contraseña
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="input-highlight"></div>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    <span><i class="fas fa-right-to-bracket" aria-hidden="true"></i> Iniciar Sesión</span>
                </button>
                
                <div id="message" class="message"></div>
            </form>
        </div>
            
        <div class="decoration">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
    </div>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
